# One file for both hosts. Each host starts only its profile (COMPOSE_PROFILES in .env):
#   data    - Kafka + Cassandra
#   compute - Spark streaming, producer, Streamlit (added in later steps)
# DATA_HOST_IP comes from the host's .env, written at first boot by Terraform's user_data.
services:
  kafka:
    profiles: [data]
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped # come back up after the EC2 host is stopped/started
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller # KRaft mode: no Zookeeper needed
      # Two doors: INTERNAL for containers on this host, EXTERNAL for the compute host.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${DATA_HOST_IP}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xmx1G -Xms1G
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 10s
      retries: 10

  # One-shot: creates the topic. 8 partitions = up to 8 Spark tasks reading in parallel.
  kafka-init:
    profiles: [data]
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092",
                 "--create", "--if-not-exists", "--topic", "transactions", "--partitions", "8",
                 "--replication-factor", "1"]
    restart: "no"

  cassandra:
    profiles: [data]
    image: cassandra:4.1
    container_name: cassandra
    restart: unless-stopped
    ports: ["9042:9042"]
    environment:
      MAX_HEAP_SIZE: 3G # 8 GB host, shared with Kafka's 1 GB
      HEAP_NEWSIZE: 600M
    volumes: [cassandra-data:/var/lib/cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 15s
      retries: 20

  # One-shot: applies the schema once Cassandra is healthy (IF NOT EXISTS, so re-runs are safe).
  cassandra-init:
    profiles: [data]
    image: cassandra:4.1
    depends_on:
      cassandra: { condition: service_healthy }
    volumes: [./cassandra/schema.cql:/schema.cql:ro]
    entrypoint: ["cqlsh", "cassandra", "-f", "/schema.cql"]
    restart: "no"

  # ---------- compute host ----------

  # Replays test transactions into Kafka. Own profile, so it never starts at boot -
  # run it on demand: docker compose run --rm producer --rate 100
  producer:
    profiles: [producer]
    build: ./producer
    environment:
      DATA_HOST_IP: ${DATA_HOST_IP}
      DATA_BUCKET: ${DATA_BUCKET}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}

  # The fraud detector: Kafka -> features -> model + SHAP -> Cassandra. Runs continuously.
  stream:
    profiles: [compute]
    build: ./stream
    container_name: stream
    restart: unless-stopped
    environment:
      DATA_HOST_IP: ${DATA_HOST_IP}
      DATA_BUCKET: ${DATA_BUCKET}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      MODEL_VERSION: v3-tuned
      TRIGGER: 1 second
    volumes: [stream-checkpoint:/checkpoint] # Kafka offsets + per-card state survive restarts

  # Live dashboard on port 8501. No inbound internet access - open it through an SSM port forward.
  dashboard:
    profiles: [compute]
    build: ./dashboard
    container_name: dashboard
    restart: unless-stopped
    ports: ["8501:8501"]
    environment:
      DATA_HOST_IP: ${DATA_HOST_IP}
      DATA_BUCKET: ${DATA_BUCKET}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}

volumes:
  kafka-data:
  cassandra-data:
  stream-checkpoint:
